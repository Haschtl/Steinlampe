; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; IMPORTANT: use the official `platformio/espressif32` platform, not the
; bare `espressif32` name - on at least one machine this was built on,
; unqualified `espressif32` resolved to the third-party "pioarduino" fork
; (platform version string "55.3.35", packages installed from
; github.com/pioarduino/registry), which has a real, reproducible bug in
; this exact framework = arduino, espidf combination: its `tool-scons`
; package gets installed correctly, then silently deleted again by
; something in its own build orchestration before the final SCons-driven
; link step runs, which then fails with "ModuleNotFoundError: No module
; named 'SCons.Tool.FortranCommon'". Confirmed scons itself was fine three
; different ways (manually pip-installed into three different PlatformIO
; Python venvs, and PlatformIO's own ToolPackageManager API confirming the
; package installs correctly with the missing module present) - the
; package kept vanishing from disk by the time the link step needed it,
; every single time, regardless of which `pio` binary/venv ran the build.
; Switching to the official `platformio/espressif32` platform (this line)
; made that whole class of failure disappear outright.
[env]
platform = platformio/espressif32@^8.0.0
framework = arduino, espidf
monitor_speed = 115200

[env:upesy_wroom]
board = upesy_wroom
; Pinned explicitly: carried over from debugging the pioarduino-fork issue
; above and left in place since it's known-working, not re-verified as
; still necessary now that the platform itself is pinned to the official
; one. Worth trying without these two lines first, next time this gets
; touched - they may no longer be needed.
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.5/esp32-3.3.5.tar.xz
    platformio/tool-scons@~4.41101.0
