; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino, espidf
monitor_speed = 115200

[env:upesy_wroom]
board = upesy_wroom
; Pinned explicitly: the platform's own manifest (platform.json) declares
; arduino-esp32 3.3.5 as its matched Arduino core version for this ESP-IDF
; release, but `pio pkg install -t framework-arduinoespressif32` picked up
; an unrelated, already-cached dev snapshot (3.20017.241212) instead, which
; turned out to be missing IDF components (esp_adc_cal) that have no
; managed-component replacement - a real version-skew, not something fixable
; via idf_component.yml.
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.5/esp32-3.3.5.tar.xz
