; Throwaway feasibility spike (see the ble-mesh plan / desktop/PLAN.md-style
; notes) - NOT part of the real quarzlampe firmware build, not wired into
; the root platformio.ini's environments on purpose.
;
; Question this answers: does NimBLE (not Bluedroid) + a BLE Mesh Node with
; a Generic OnOff Server model actually provision and respond on real
; upesy_wroom (classic ESP32) hardware? The official precompiled
; `framework = arduino`-only distribution's libs package does NOT ship the
; native NimBLE host component for the classic ESP32 chip at all (checked
; the actual installed arduino-esp32 3.x libs locally: esp32/include/bt/host/
; only has bluedroid/, unlike esp32c3/c6/p4 which do have a nimble/ dir) -
; so this uses the mixed `arduino, espidf` framework instead, which builds
; the real ESP-IDF from source against our own sdkconfig.defaults, where
; CONFIG_BT_NIMBLE_ENABLED for CONFIG_IDF_TARGET_ESP32 is a combination
; esp_ble_mesh's own source code supports (see mesh/adapter.h's #ifdef
; CONFIG_BT_NIMBLE_ENABLED / #if CONFIG_IDF_TARGET_ESP32 branch) - just not
; one Espressif chose to also ship precompiled for the fast path.
;
; First build here downloads the full ESP-IDF toolchain (a separate,
; multi-GB `framework-espidf` package, nothing like the lightweight
; `framework-arduinoespressif32-libs` the main firmware uses) - expect that
; to take a while the first time.
;
; Main.cpp was written against the real esp_ble_mesh/NimBLE headers (API
; shapes verified by reading them directly) but never compiled - no ESP-IDF
; toolchain was available on the machine that wrote this. Expect to fix
; real compile errors on the first build; that's what this spike is for.

[env]
platform = espressif32
framework = arduino, espidf
monitor_speed = 115200

[env:upesy_wroom]
board = upesy_wroom
