[package]
name = "quarzlampe-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
btleplug = "0.13.5"
directories = "6.0.0"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "io-std", "net"] }
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["serde", "v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.18.2"
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = { version = "0.2.18", default-features = false, features = ["core_audio"] }
