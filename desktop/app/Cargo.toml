[package]
name = "quarzlampe-tray"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
directories = "6.0.0"
global-hotkey = "0.8.0"
muda = "0.21.2"
open = "5.4.4"
quarzlampe-core = { version = "0.1.0", path = "../core" }
sysinfo = "0.39.6"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
uuid = { version = "1.28.0", features = ["v4"] }
# ksni instead of the default libappindicator backend: on Linux/BSD it runs its
# D-Bus service on its own worker thread, so it doesn't need a GTK (or any)
# event loop pumped from this process at all - which is exactly why this crate
# has no eframe/egui/winit dependency: this binary never creates a window.
# GNOME-on-Wayland without an extension still won't show any tray icon either
# way - that's a compositor limitation, not something either backend fixes.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3.34"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"
# Same version `global-hotkey` itself already resolves to for its own Windows
# backend (see Cargo.lock) - raw windows-sys, not the higher-level `windows`
# crate, to match that existing dependency rather than add a second,
# differently-shaped Win32 binding on top of it.
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Same objc2 family/versions `tray-icon`/`muda`/`global-hotkey` already pull
# in for their own macOS backends (see Cargo.lock) - reusing those exact
# versions rather than introducing a second, possibly-conflicting generation
# of the same bindings.
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSDate",
    "NSDistributedNotificationCenter",
    "NSNotification",
    "NSOperation",
    "NSString",
    "NSTimer",
    "block2",
] }
