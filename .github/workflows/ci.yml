name: CI - Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Pinned, not '3.x': a brand-new CPython release often has no
          # prebuilt pydantic-core wheel yet, which forces a from-source
          # build (needs a Rust/maturin toolchain this bare runner doesn't
          # have) and breaks installing PlatformIO's esp-idf tooling
          # (idf_component_manager depends on pydantic).
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio


      - name: Build (quarzlampe)
        run: pio run -e quarzlampe

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-quarzlampe
          path: .pio/build/quarzlampe/firmware.bin

      - name: Build (quarzlampe_rd03)
        run: pio run -e quarzlampe_rd03

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-quarzlampe_rd03
          path: .pio/build/quarzlampe_rd03/firmware.bin

      - name: Build (quarzlampe_rd03d)
        run: pio run -e quarzlampe_rd03d

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-quarzlampe_rd03d
          path: .pio/build/quarzlampe_rd03d/firmware.bin

      - name: Build (desk_lamp)
        run: pio run -e desk_lamp

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-desk_lamp
          path: .pio/build/desk_lamp/firmware.bin

      - name: Build (on_air)
        run: pio run -e on_air

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-on_air
          path: .pio/build/on_air/firmware.bin
