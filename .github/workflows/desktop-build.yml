name: CI - Build Desktop App

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # only strictly needed on windows, for the SignPath action on a private repo - harmless elsewhere
    # Job-level (not step-level) on purpose: a step's `if:` is evaluated
    # before that same step's own `env:` block takes effect, so a secret
    # check has to come from env already set at the job (or an earlier
    # step), not from a step checking its own declared env.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # muda's default GTK3 backend, bluez-async/btleplug's dbus backend, and
      # core::mic::linux's direct libpulse-binding usage all need their
      # system dev headers - see desktop/PLAN.md for why each is there.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libdbus-1-dev libpulse-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop

      # `GITHUB_SHA` is one of Actions' own default env vars, always set -
      # `core/build.rs` reads it to bake the commit a build came from into
      # `core::update::BUILD_SHA`, which is how the auto-update check (see
      # that module's doc comment) tells "this build" apart from "the
      # latest published one". A plain local `cargo build` never has this
      # var set, so it always gets `"dev"` there instead.
      - name: Build workspace (release)
        working-directory: desktop
        run: cargo build --release --workspace

      # Both exes, zipped - extract and run quarzlampe-tray.exe directly, no
      # installer needed. `quarzlampe-tray.exe --install` still works from
      # inside the extracted folder for anyone who wants autostart without
      # the MSI. This (not a loose single .exe) is also what the in-app
      # updater (`core::self_update`) downloads for a Windows self-update.
      - name: Build portable zip (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          pwsh -File desktop/packaging/windows/build-portable-zip.ps1 -ReleaseDir desktop/target/release -OutDir dist

      # Builds Quarzlampe-x86_64.AppImage - verified live on a real
      # Manjaro machine (not just written-by-inspection like the other two
      # platforms' packaging): the daemon starts correctly from inside the
      # mounted AppImage and finds the console binary as a sibling at its
      # mounted path. See desktop/PLAN.md and the script's own comments.
      - name: Build AppImage
        if: matrix.platform == 'linux'
        run: |
          bash desktop/packaging/linux/build-appimage.sh desktop/target/release dist

      # Builds Quarzlampe.dmg (a real .app bundle, ad-hoc signed - free,
      # see the script's own comments for why that's not the same as
      # Gatekeeper-clearing notarization - inside a disk image with a
      # symlink to /Applications for the standard drag-to-install flow) -
      # and, from the same signed .app bundle, Quarzlampe-portable-macos.zip
      # (no /Applications drag-and-drop needed; also what the in-app
      # updater downloads for a macOS self-update).
      # Unverified: no macOS machine here to run this.
      - name: Build DMG
        if: matrix.platform == 'macos'
        run: |
          bash desktop/packaging/macos/build-dmg.sh desktop/target/release dist

      # WiX Toolset v3 (candle.exe/light.exe) ships preinstalled on
      # windows-latest at $env:WIX - no setup step needed. Produces an
      # unsigned quarzlampe-installer.msi; the SignPath step further down
      # signs this exact file when its secrets are configured, replacing
      # it in dist/ - signing the installer itself, not the loose exes
      # inside it, is what actually matters for SmartScreen. See
      # desktop/packaging/windows/main.wxs for exactly what it installs.
      # Unverified: no Windows machine here to run this.
      - name: Build MSI installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path wixobj | Out-Null
          & "$env:WIX\bin\candle.exe" "-dCargoTargetBinDir=desktop\target\release" "-dVersion=0.1.0" -out "wixobj\main.wixobj" "desktop\packaging\windows\main.wxs"
          & "$env:WIX\bin\light.exe" -ext WixUIExtension "wixobj\main.wixobj" -out "dist\quarzlampe-installer.msi"

      # Free code signing for this (now GPL-3.0-or-later, genuinely open
      # source) project via the SignPath Foundation - see
      # desktop/CODE_SIGNING_POLICY.md. Inactive (and these two steps
      # simply don't run) until `SIGNPATH_API_TOKEN` and the three
      # `vars.SIGNPATH_*` values below exist, which only happens after
      # applying at https://signpath.io/apply and being approved - an
      # identity-linked step only the repo owner can do, not something
      # scaffolding alone can activate. Until then the installer built
      # above stays unsigned, same as today.
      - name: Upload unsigned MSI for SignPath
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-installer
          path: dist/quarzlampe-installer.msi

      - name: Sign MSI via SignPath
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use SignPath-signed MSI
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item signed\quarzlampe-installer.msi dist\ -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: quarzlampe-desktop-${{ matrix.platform }}
          path: dist/

  # Separate from the matrix build above and never runs automatically - a
  # deliberate, manually-triggered step (someone has to click "Run
  # workflow") rather than something that republishes on every commit,
  # since this is still an early, Linux-only-verified feature (see
  # PLAN.md): Windows/macOS here means "it compiles on that OS's own GitHub
  # runner", not "BLE/mic detection were ever exercised on that OS".
  publish-release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Rename binaries per platform
        run: |
          set -eu
          mkdir -p release
          cp artifacts/quarzlampe-desktop-linux/Quarzlampe-x86_64.AppImage release/Quarzlampe-x86_64.AppImage
          cp artifacts/quarzlampe-desktop-macos/Quarzlampe.dmg release/Quarzlampe.dmg
          cp artifacts/quarzlampe-desktop-macos/Quarzlampe-portable-macos.zip release/Quarzlampe-portable-macos.zip
          cp artifacts/quarzlampe-desktop-windows/quarzlampe-installer.msi release/Quarzlampe-installer.msi
          cp artifacts/quarzlampe-desktop-windows/Quarzlampe-portable-windows.zip release/Quarzlampe-portable-windows.zip
          chmod +x release/Quarzlampe-x86_64.AppImage

      # `core::update::check_for_update` compares the running binary's own
      # embedded commit (baked in by `core/build.rs` from `GITHUB_SHA`,
      # always set in Actions) against this file - not against the
      # release/tag's own git ref, which this action isn't documented to
      # reliably move when republishing to an already-existing tag like
      # `desktop-latest`. Keeping this under direct control here instead
      # avoids depending on that.
      - name: Record the build's commit SHA for the auto-updater
        run: echo "${{ github.sha }}" > release/BUILD_SHA.txt

      - name: Publish/replace the desktop-latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-latest
          name: Desktop app - latest build
          body: |
            Builds of the Quarzlampe desktop tray app, rebuilt from the tip of `main` whenever this
            workflow is run by hand - not a versioned release. The app itself checks this release
            periodically and offers to update in place (tray menu + console "Update now") when a
            newer build has been published - see the self-update note below.

            **Two options per platform**: a proper installer (`Quarzlampe-installer.msi` on
            Windows, `Quarzlampe.dmg` on macOS - Start Menu/Applications entry, uninstaller) or a
            standalone zip (`Quarzlampe-portable-*.zip`) you just extract and run, no installation
            step at all. **Linux** only has one option, `Quarzlampe-x86_64.AppImage`, which is
            already both (a single file, nothing to install).

            **Linux**: built and functionally verified against real hardware; the AppImage itself
            was verified live too (daemon starts correctly from the mounted image).
            **Windows/macOS**: built on that OS's own GitHub-hosted runner, but BLE and mic/camera
            activity detection - and the installer/zip packaging itself - have not been exercised
            on either. Treat as experimental.

            **Self-update**: downloads the matching file above (AppImage/portable zip) and swaps it
            into the currently running install, then restarts. Still unsigned (see
            `desktop/CODE_SIGNING_POLICY.md`), so this trusts plain HTTPS + GitHub with nothing
            further to verify the download against - a deliberate, accepted tradeoff until real
            code signing exists, not an oversight. Manual download always remains the fallback.

            **macOS**: the `.app` (DMG or portable zip) is ad-hoc signed (free), not notarized. Gatekeeper
            will still block it on first launch - right-click (or Control-click) it, choose "Open",
            then confirm "Open Anyway".
            **Windows**: the MSI is signed via a free [SignPath](https://signpath.io/) certificate
            if one has been set up for this project (see `desktop/CODE_SIGNING_POLICY.md`) -
            otherwise unsigned, and SmartScreen will warn ("More info" -> "Run anyway").
          prerelease: true
          files: release/*
