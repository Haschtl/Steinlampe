name: CI - Build Desktop App

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # only strictly needed on windows, for the SignPath action on a private repo - harmless elsewhere
    # Job-level (not step-level) on purpose: a step's `if:` is evaluated
    # before that same step's own `env:` block takes effect, so a secret
    # check has to come from env already set at the job (or an earlier
    # step), not from a step checking its own declared env.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # muda's default GTK3 backend, bluez-async/btleplug's dbus backend, and
      # core::mic::linux's direct libpulse-binding usage all need their
      # system dev headers - see desktop/PLAN.md for why each is there.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libdbus-1-dev libpulse-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # `GITHUB_SHA` is one of Actions' own default env vars, always set -
      # `core/build.rs` reads it to bake the commit a build came from into
      # `core::update::BUILD_SHA`, which is how the auto-update check (see
      # that module's doc comment) tells "this build" apart from "the
      # latest published one". A plain local `cargo build` never has this
      # var set, so it always gets `"dev"` there instead.
      - name: Build workspace (release)
        working-directory: desktop
        run: cargo build --release --workspace

      # Free, no Apple Developer account needed - just the Xcode command
      # line tools already on every macos-latest runner. This is *not* the
      # same as the paid Developer ID + notarization path: it satisfies
      # Apple Silicon's blanket requirement that executables carry some
      # signature to run at all, but it does nothing for Gatekeeper's
      # "unidentified developer" warning on a downloaded file - that still
      # shows up, and the release notes below tell people how to bypass it
      # (right-click -> Open -> "Open Anyway"). There is no free way to
      # remove the warning itself; only a $99/year Apple Developer Program
      # membership (Developer ID signing + notarization) does that, which
      # this project isn't pursuing right now.
      - name: Ad-hoc sign macOS binaries
        if: matrix.platform == 'macos'
        run: |
          set -eu
          codesign --force --deep --sign - desktop/target/release/quarzlampe-tray
          codesign --force --deep --sign - desktop/target/release/quarzlampe-console

      - name: Collect binaries (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p dist
          cp desktop/target/release/quarzlampe-tray dist/
          cp desktop/target/release/quarzlampe-console dist/

      - name: Collect binaries (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item desktop/target/release/quarzlampe-tray.exe dist/
          Copy-Item desktop/target/release/quarzlampe-console.exe dist/

      # Free code signing for this (now GPL-3.0-or-later, genuinely open
      # source) project via the SignPath Foundation - see
      # desktop/CODE_SIGNING_POLICY.md. Inactive (and these two steps
      # simply don't run) until `SIGNPATH_API_TOKEN` and the three
      # `vars.SIGNPATH_*` values below exist, which only happens after
      # applying at https://signpath.io/apply and being approved - an
      # identity-linked step only the repo owner can do, not something
      # scaffolding alone can activate. Until then the Windows binaries
      # collected above stay unsigned, same as today.
      - name: Upload unsigned Windows binaries for SignPath
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-binaries
          path: |
            desktop/target/release/quarzlampe-tray.exe
            desktop/target/release/quarzlampe-console.exe

      - name: Sign Windows binaries via SignPath
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use SignPath-signed Windows binaries
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item signed\quarzlampe-tray.exe dist\ -Force
          Copy-Item signed\quarzlampe-console.exe dist\ -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarzlampe-desktop-${{ matrix.platform }}
          path: dist/

  # Separate from the matrix build above and never runs automatically - a
  # deliberate, manually-triggered step (someone has to click "Run
  # workflow") rather than something that republishes on every commit,
  # since this is still an early, Linux-only-verified feature (see
  # PLAN.md): Windows/macOS here means "it compiles on that OS's own GitHub
  # runner", not "BLE/mic detection were ever exercised on that OS".
  publish-release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries per platform
        run: |
          set -eu
          mkdir -p release
          cp artifacts/quarzlampe-desktop-linux/quarzlampe-tray release/quarzlampe-tray-linux
          cp artifacts/quarzlampe-desktop-linux/quarzlampe-console release/quarzlampe-console-linux
          cp artifacts/quarzlampe-desktop-macos/quarzlampe-tray release/quarzlampe-tray-macos
          cp artifacts/quarzlampe-desktop-macos/quarzlampe-console release/quarzlampe-console-macos
          cp artifacts/quarzlampe-desktop-windows/quarzlampe-tray.exe release/quarzlampe-tray-windows.exe
          cp artifacts/quarzlampe-desktop-windows/quarzlampe-console.exe release/quarzlampe-console-windows.exe
          chmod +x release/quarzlampe-tray-linux release/quarzlampe-console-linux release/quarzlampe-tray-macos release/quarzlampe-console-macos

      # `core::update::check_for_update` compares the running binary's own
      # embedded commit (baked in by `core/build.rs` from `GITHUB_SHA`,
      # always set in Actions) against this file - not against the
      # release/tag's own git ref, which this action isn't documented to
      # reliably move when republishing to an already-existing tag like
      # `desktop-latest`. Keeping this under direct control here instead
      # avoids depending on that.
      - name: Record the build's commit SHA for the auto-updater
        run: echo "${{ github.sha }}" > release/BUILD_SHA.txt

      - name: Publish/replace the desktop-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Desktop app - latest build
          body: |
            Builds of the Quarzlampe desktop tray app, rebuilt from the tip of `main` whenever this
            workflow is run by hand - not a versioned release. The app itself checks this release
            periodically and shows an "Update available" link (tray menu + console) when a newer
            build has been published; it never downloads or installs anything automatically.

            **Linux**: built and functionally verified against real hardware.
            **Windows/macOS**: built on that OS's own GitHub-hosted runner, but BLE and mic/camera
            activity detection have not been exercised on either - treat as experimental.

            **macOS**: ad-hoc signed (free), not notarized. Gatekeeper will still block the binary
            on first launch - right-click (or Control-click) it, choose "Open", then confirm
            "Open Anyway".
            **Windows**: signed via a free [SignPath](https://signpath.io/) certificate if one has
            been set up for this project (see `desktop/CODE_SIGNING_POLICY.md`) - otherwise
            unsigned, and SmartScreen will warn ("More info" -> "Run anyway").
          prerelease: true
          files: release/*
