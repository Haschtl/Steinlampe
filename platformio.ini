; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:upesy_wroom]
; Bumped from the espressif32 6.x line (arduino-esp32 2.0.x core) to the official
; platform on arduino-esp32 3.3.5, and from plain `framework = arduino` (precompiled
; libs) to the mixed `arduino, espidf` source build - required for BLE Mesh support
; (esp_ble_mesh and CONFIG_BT_NIMBLE_ENABLED aren't in the precompiled Arduino-only
; distribution at all, confirmed in spikes/ble-mesh/). Use the official
; `platformio/espressif32` name, not bare `espressif32` - that bare name has resolved
; to a third-party "pioarduino" fork on at least one machine, with a real reproducible
; tool-scons bug in this exact build mode (see spikes/ble-mesh/platformio.ini).
;
; The 2.x->3.x core jump breaks ledcSetup()/ledcAttachPin() (removed in 3.x, replaced
; by ledcAttach() + pin-based ledcWrite()) - ported in lamp_state.cpp/main.cpp.
;
; Step 2 (see the plan this came from): comms.cpp/midi_ble.cpp/presence_ble.cpp now
; speak the native ESP-IDF NimBLE host API directly (CONFIG_BT_NIMBLE_ENABLED below)
; instead of going through the NimBLE-Arduino C++ wrapper - that wrapper calls
; ble_svc_gap_init()/ble_svc_gatt_init() itself with no coordination, which collided
; with esp_ble_mesh's own calls to the same functions in a boot-loop assert on real
; hardware (documented in spikes/ble-mesh/README.md's "Decision gate"). The native
; API is the one spikes/ble-mesh/'s Mesh node already used, so adding Mesh itself in
; Step 3 is now just one more set of services on the same already-native host.
platform = platformio/espressif32@^8.0.0
board = upesy_wroom
framework = arduino, espidf
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.5/esp32-3.3.5.tar.xz
    platformio/tool-scons@~4.41101.0
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
monitor_speed=115200
monitor_filters = esp32_exception_decoder
; In `framework = arduino, espidf` mode this resolves relative to the project
; root, not the framework package's own tools/partitions/ dir like plain
; `framework = arduino` does - so it's vendored here as a local copy (same
; stock arduino-esp32 min_spiffs.csv as before, unchanged content).
board_build.partitions = min_spiffs.csv
; No lib_deps for BLE anymore: the native ESP-IDF NimBLE host (CONFIG_BT_NIMBLE_ENABLED,
; sdkconfig.defaults) ships inside the espidf framework itself, nothing to pull in via
; PlatformIO's library manager. comms.cpp/midi_ble.cpp/presence_ble.cpp talk to it
; directly (see the Step 2 comment on platform= above) - no more h2zero/NimBLE-Arduino.
; Note: NimBLE claims the controller BLE-only on init (frees the Classic-BT/SPP
; memory) - see the ENABLE_BLE/ENABLE_BT_SERIAL #error in lamp_config.h.

; Not an [env:...] section - PlatformIO only treats `env:`-prefixed sections as
; buildable environments, so this is just shared data for ${...} interpolation
; below, not a 6th environment `pio run` would try to build. Holds every
; quarzlampe-family flag EXCEPT FIRMWARE_ENV, which must stay unique per leaf
; env - duplicating a `-D FIRMWARE_ENV=...` across an inherited block *and* a
; leaf's own block is a hard -Werror ("redefined") under the ESP-IDF-backed
; build (silently tolerated under the old plain-Arduino build, so this split
; wasn't needed before).
[quarzlampe_common]
build_flags =
; -DCORE_DEBUG_LEVEL=5
  -DQUARZLAMPE=1
  -DENABLE_SWITCH=1
  -DENABLE_LIGHT_SENSOR=1
  -DENABLE_MUSIC_MODE=1
  -DENABLE_TOUCH_DIM=1
  -DENABLE_BLE_MIDI=1
; NimBLE and BluetoothSerial can't coexist on this chip (see lamp_config.h) -
; BLE (the app connection) wins; override back to 1 at build time if you need
; Classic-BT Serial again and can live without BLE for that build.
  -DENABLE_BT_SERIAL=0
; Rolled out from desk_lamp once Mesh was verified working there (provisioning,
; Proxy, Composition Data, AppKey Add, Generic OnOff/Light Lightness control,
; alongside the existing custom BLE protocol) - same classic-ESP32 GATT
; coexistence patch applies here too (see env:desk_lamp's own comment and
; scripts/patch_mesh_gatt_coex.py).
  -DENABLE_BLE_MESH=1
  -DQUARZLAMPE_MESH_GATT_COEX=1
; Self-provisioning (see the feat/ble-mesh plan): this lamp can provision
; others into the mesh itself, no nRF Mesh needed. Independent flag so it
; can be turned off per-env later if flash/RAM pressure ever shows up -
; everything else about Mesh stays on either way.
  -DENABLE_BLE_MESH_PROVISIONER=1

[env:quarzlampe]
extends = env:upesy_wroom
extra_scripts = pre:scripts/patch_mesh_gatt_coex.py
build_flags =
  ${quarzlampe_common.build_flags}
  -D FIRMWARE_ENV='"quarzlampe"'

[env:quarzlampe_rd03]
extends = env:upesy_wroom
extra_scripts = pre:scripts/patch_mesh_gatt_coex.py
build_flags =
  ${quarzlampe_common.build_flags}
  -D FIRMWARE_ENV='"quarzlampe_rd03"'
  -DENABLE_RD03=1
  -DRD03_MULTI_TARGET=0
  -DRD03_BAUD=256000

[env:quarzlampe_rd03d]
extends = env:upesy_wroom
extra_scripts = pre:scripts/patch_mesh_gatt_coex.py
build_flags =
  ${quarzlampe_common.build_flags}
  -D FIRMWARE_ENV='"quarzlampe_rd03d"'
  -DENABLE_RD03=1
  -DRD03_MULTI_TARGET=1
  -DRD03_BAUD=256000

[env:desk_lamp]
extends = env:upesy_wroom
; Patches framework-espidf's esp_ble_mesh component (see the script's own
; docstring) so BLE Mesh doesn't double-call ble_gatts_start() against our
; own NimBLE GATT services - required for ENABLE_BLE_MESH below. Idempotent,
; safe to run on every build.
extra_scripts = pre:scripts/patch_mesh_gatt_coex.py
build_flags =
  -D FIRMWARE_ENV='"desk_lamp"'
  -DSCHREIBTISCHLAMPE=1
  -DENABLE_SWITCH=0
  -DENABLE_EXT_INPUT=1
  -DENABLE_POTI=1
  -DPIN_PWM=33
  -DEXT_INPUT_PIN_NUM=32
  -DPWM_INVERT_OUTPUT=1
; This board's physical potentiometer wiring reads "backwards" relative to
; the default (raw ADC high = knob turned toward max) - compile-time default
; instead of relying on NVS's runtime poti_inv setting, which resets to the
; code default (false) on an empty/erased NVS and silently un-inverts it.
  -DPOTI_INVERT_DEFAULT_VAL=true
  -DENABLE_BLE_MIDI=1
; See env:quarzlampe - NimBLE and BluetoothSerial can't coexist on this chip.
  -DENABLE_BT_SERIAL=0
; BLE Mesh + the NLC Basic Lightness Controller profile on top of the native
; NimBLE host - first proven here, since rolled out to every other env too
; (see quarzlampe_common and env:on_air).
  -DENABLE_BLE_MESH=1
; Enables the patched code path in esp_ble_mesh/core/nimble_host/adapter.c
; (see extra_scripts above) - classic ESP32 has no SOC_BLE_50_SUPPORTED, so
; Espressif's own upstream fix for this (CONFIG_BLE_MESH_USE_BLE_50) isn't
; selectable here; this flag widens that same guard without requiring it.
  -DQUARZLAMPE_MESH_GATT_COEX=1
; Self-provisioning (see the feat/ble-mesh plan): this lamp can provision
; others into the mesh itself, no nRF Mesh needed. Independent flag so it
; can be turned off per-env later if flash/RAM pressure ever shows up -
; everything else about Mesh stays on either way.
  -DENABLE_BLE_MESH_PROVISIONER=1

[env:on_air]
; ESP32-S3 Super Mini. GPIO1/GPIO8 are free there (unlike upesy_wroom's ESP32-WROOM-32,
; where GPIO1 is UART0 TX and GPIO8 is wired to the module's integrated SPI flash).
; ENABLE_BT_SERIAL=0: ESP32-S3 has no Bluetooth Classic (BR/EDR) radio, only BLE, so
; BluetoothSerial/SPP won't link.
; No official PlatformIO board def exists for the Super Mini clone; esp32-s3-devkitc-1
; is the closest match for the chip/variant, with flash_size corrected to the Super
; Mini's actual 4MB (board default assumes 8MB). board_build.partitions (min_spiffs.csv,
; inherited from upesy_wroom) already fits exactly within 4MB.
extends = env:upesy_wroom
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
; ESP32-S3 has SOC_BLE_50_SUPPORTED, unlike classic ESP32, so it could in
; principle use Espressif's own upstream fix for the Mesh/NimBLE
; ble_gatts_start() double-call crash (CONFIG_BLE_MESH_USE_BLE_50) instead of
; the patch script below - tried that first, but it hit two real problems:
; PlatformIO's "custom_sdkconfig" (the usual way to inject extra sdkconfig
; lines per env) is silently a no-op in `framework = arduino, espidf` mixed
; mode (confirmed by reading platform-espressif32's espidf.py - its handler
; only runs for plain `framework = arduino`), and separately, enabling
; CONFIG_BLE_MESH_USE_BLE_50 with the NimBLE host fails to compile at all
; unless CONFIG_BLE_MESH_EXT_ADV is *also* on (adapter.c's disc_cb()
; unconditionally references BLE_MESH_EXT_ADV_NONCONN_IND, which only exists
; #if CONFIG_BLE_MESH_EXT_ADV, despite Kconfig listing it as optional/default
; n) - pulling in real BLE 5.0 extended-advertising machinery this board
; doesn't need just to get the coexistence fix. Simpler and consistent to
; just reuse the same patch as the classic-ESP32 envs here too.
extra_scripts = pre:scripts/patch_mesh_gatt_coex.py
build_flags =
  -D FIRMWARE_ENV='"on_air"'
  -DON_AIR=1
  -DENABLE_SWITCH=1
  -DENABLE_BT_SERIAL=0
  -DENABLE_BLE_MIDI=1
  -DPIN_PWM=1
  -DPIN_SWITCH=8
  -DENABLE_BLE_MESH=1
  -DQUARZLAMPE_MESH_GATT_COEX=1
; Self-provisioning (see the feat/ble-mesh plan): this lamp can provision
; others into the mesh itself, no nRF Mesh needed. Independent flag so it
; can be turned off per-env later if flash/RAM pressure ever shows up -
; everything else about Mesh stays on either way.
  -DENABLE_BLE_MESH_PROVISIONER=1
