; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:upesy_wroom]
; Bumped from the espressif32 6.x line (arduino-esp32 2.0.x core) to the official
; platform on arduino-esp32 3.3.5, and from plain `framework = arduino` (precompiled
; libs) to the mixed `arduino, espidf` source build - required for BLE Mesh support
; (esp_ble_mesh and CONFIG_BT_NIMBLE_ENABLED aren't in the precompiled Arduino-only
; distribution at all, confirmed in spikes/ble-mesh/). Use the official
; `platformio/espressif32` name, not bare `espressif32` - that bare name has resolved
; to a third-party "pioarduino" fork on at least one machine, with a real reproducible
; tool-scons bug in this exact build mode (see spikes/ble-mesh/platformio.ini).
;
; The 2.x->3.x core jump breaks ledcSetup()/ledcAttachPin() (removed in 3.x, replaced
; by ledcAttach() + pin-based ledcWrite()) - ported in lamp_state.cpp/main.cpp.
;
; BLE itself still doesn't depend on this platform pin directly - NimBLE-Arduino
; brings its own BLE host stack. This step keeps NimBLE-Arduino as-is; it does NOT
; yet add Mesh or touch comms.cpp/midi_ble.cpp/presence_ble.cpp (see the plan this
; came from - that's Steps 2/3).
platform = platformio/espressif32@^8.0.0
board = upesy_wroom
framework = arduino, espidf
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.5/esp32-3.3.5.tar.xz
    platformio/tool-scons@~4.41101.0
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
monitor_speed=115200
monitor_filters = esp32_exception_decoder
; In `framework = arduino, espidf` mode this resolves relative to the project
; root, not the framework package's own tools/partitions/ dir like plain
; `framework = arduino` does - so it's vendored here as a local copy (same
; stock arduino-esp32 min_spiffs.csv as before, unchanged content).
board_build.partitions = min_spiffs.csv
; Replaces the bundled Bluedroid BLE library (unstable under repeated connects -
; leaks heap per connect/disconnect cycle, and BLECharacteristic::notify() has no
; congestion feedback, so a congested link silently drops/corrupts notification
; chunks instead of retrying). NimBLE uses ~100KB less RAM, handles congestion
; properly (notify() returns a success bool - see flushBleNotification() in
; comms.cpp), and has real connection-parameter/bonding support.
; Note: NimBLE claims the controller BLE-only on init (frees the Classic-BT/SPP
; memory) - see the ENABLE_BLE/ENABLE_BT_SERIAL #error in lamp_config.h.
lib_deps =
  h2zero/NimBLE-Arduino@^2.5.0

; Not an [env:...] section - PlatformIO only treats `env:`-prefixed sections as
; buildable environments, so this is just shared data for ${...} interpolation
; below, not a 6th environment `pio run` would try to build. Holds every
; quarzlampe-family flag EXCEPT FIRMWARE_ENV, which must stay unique per leaf
; env - duplicating a `-D FIRMWARE_ENV=...` across an inherited block *and* a
; leaf's own block is a hard -Werror ("redefined") under the ESP-IDF-backed
; build (silently tolerated under the old plain-Arduino build, so this split
; wasn't needed before).
[quarzlampe_common]
build_flags =
; -DCORE_DEBUG_LEVEL=5
  -DQUARZLAMPE=1
  -DENABLE_SWITCH=1
  -DENABLE_LIGHT_SENSOR=1
  -DENABLE_MUSIC_MODE=1
  -DENABLE_TOUCH_DIM=1
  -DENABLE_BLE_MIDI=1
; NimBLE and BluetoothSerial can't coexist on this chip (see lamp_config.h) -
; BLE (the app connection) wins; override back to 1 at build time if you need
; Classic-BT Serial again and can live without BLE for that build.
  -DENABLE_BT_SERIAL=0

[env:quarzlampe]
extends = env:upesy_wroom
build_flags =
  ${quarzlampe_common.build_flags}
  -D FIRMWARE_ENV='"quarzlampe"'

[env:quarzlampe_rd03]
extends = env:upesy_wroom
build_flags =
  ${quarzlampe_common.build_flags}
  -D FIRMWARE_ENV='"quarzlampe_rd03"'
  -DENABLE_RD03=1
  -DRD03_MULTI_TARGET=0
  -DRD03_BAUD=256000

[env:quarzlampe_rd03d]
extends = env:upesy_wroom
build_flags =
  ${quarzlampe_common.build_flags}
  -D FIRMWARE_ENV='"quarzlampe_rd03d"'
  -DENABLE_RD03=1
  -DRD03_MULTI_TARGET=1
  -DRD03_BAUD=256000

[env:desk_lamp]
extends = env:upesy_wroom
build_flags =
  -D FIRMWARE_ENV='"desk_lamp"'
  -DSCHREIBTISCHLAMPE=1
  -DENABLE_SWITCH=0
  -DENABLE_EXT_INPUT=1
  -DENABLE_POTI=1
  -DPIN_PWM=33
  -DEXT_INPUT_PIN_NUM=32
  -DPWM_INVERT_OUTPUT=1
  -DENABLE_BLE_MIDI=1
; See env:quarzlampe - NimBLE and BluetoothSerial can't coexist on this chip.
  -DENABLE_BT_SERIAL=0

[env:on_air]
; ESP32-S3 Super Mini. GPIO1/GPIO8 are free there (unlike upesy_wroom's ESP32-WROOM-32,
; where GPIO1 is UART0 TX and GPIO8 is wired to the module's integrated SPI flash).
; ENABLE_BT_SERIAL=0: ESP32-S3 has no Bluetooth Classic (BR/EDR) radio, only BLE, so
; BluetoothSerial/SPP won't link.
; No official PlatformIO board def exists for the Super Mini clone; esp32-s3-devkitc-1
; is the closest match for the chip/variant, with flash_size corrected to the Super
; Mini's actual 4MB (board default assumes 8MB). board_build.partitions (min_spiffs.csv,
; inherited from upesy_wroom) already fits exactly within 4MB.
extends = env:upesy_wroom
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
build_flags =
  -D FIRMWARE_ENV='"on_air"'
  -DON_AIR=1
  -DENABLE_SWITCH=1
  -DENABLE_BT_SERIAL=0
  -DENABLE_BLE_MIDI=1
  -DPIN_PWM=1
  -DPIN_SWITCH=8
